name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check firmware structure
        run: |
          ls -la HeartLens_Firmware/src/
          ls -la HeartLens_Firmware/models/
      - name: Verify model headers
        run: |
          head -5 HeartLens_Firmware/models/denoiser_model.h
          head -5 HeartLens_Firmware/models/classifier_model.h

  training-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f heart-lens-training/requirements.txt ]; then pip install -r heart-lens-training/requirements.txt; fi
      - name: Lint with flake8
        run: |
          flake8 heart-lens-training/ --count --select=E9,F63,F7,F82 --show-source --statistics
