<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 940" font-family="Times, serif" font-size="26">
  <defs>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <text x="390" y="40" text-anchor="middle" font-size="30" fill="#111">Experimental methodology</text>

  <g stroke="#2c3e50" stroke-width="2.5" fill="#eef3f8">
    <rect x="40" y="64"  width="700" height="104" rx="12"/>
    <rect x="40" y="184" width="700" height="104" rx="12"/>
    <rect x="40" y="304" width="700" height="104" rx="12"/>
    <rect x="40" y="424" width="700" height="104" rx="12"/>
    <rect x="40" y="544" width="700" height="118" rx="12"/>
    <rect x="40" y="678" width="700" height="118" rx="12"/>
    <rect x="40" y="812" width="700" height="104" rx="12"/>
  </g>

  <text x="390" y="102" text-anchor="middle"><tspan x="390" dy="0">MIT-BIH Arrhythmia DB</tspan><tspan x="390" dy="30">(48 recordings, 360 Hz)</tspan></text>
  <text x="390" y="222" text-anchor="middle"><tspan x="390" dy="0">R-peak 1-s windows, classes N/A/V</tspan><tspan x="390" dy="30">per-window normalization to [-1, 1]</tspan></text>
  <text x="390" y="342" text-anchor="middle"><tspan x="390" dy="0">Patient-level split</tspan><tspan x="390" dy="30">train / validation / test (record-aware)</tspan></text>
  <text x="390" y="462" text-anchor="middle"><tspan x="390" dy="0">Architectures: CNN . LSTM . GRU . TCN</tspan><tspan x="390" dy="30">+ Conv1D autoencoder denoiser</tspan></text>
  <text x="390" y="578" text-anchor="middle"><tspan x="390" dy="0">E4 Quantization + calibration</tspan><tspan x="390" dy="30">FP32 to int8 TFLite (CNN/TCN full-int8,</tspan><tspan x="390" dy="30">LSTM/GRU float32); temperature T</tspan></text>
  <text x="390" y="712" text-anchor="middle"><tspan x="390" dy="0">Experiments</tspan><tspan x="390" dy="30">E1 grouped CV . E2 noise 0-40 dB</tspan><tspan x="390" dy="30">E3 external SVDB validation</tspan></text>
  <text x="390" y="850" text-anchor="middle"><tspan x="390" dy="0">E5 On-device verification</tspan><tspan x="390" dy="30">ESP32-S3 int8, memory and latency</tspan></text>

  <line x1="390" y1="168" x2="390" y2="180" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
  <line x1="390" y1="288" x2="390" y2="300" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
  <line x1="390" y1="408" x2="390" y2="420" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
  <line x1="390" y1="528" x2="390" y2="540" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
  <line x1="390" y1="662" x2="390" y2="674" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
  <line x1="390" y1="796" x2="390" y2="808" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
</svg>