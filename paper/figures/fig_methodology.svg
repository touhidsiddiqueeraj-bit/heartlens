<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 960" font-family="Times, serif" font-size="28">
  <defs>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <text x="390" y="42" text-anchor="middle" font-size="32" fill="#111">Experimental methodology</text>

  <g stroke="#2c3e50" stroke-width="2.5" fill="#eef3f8">
    <rect x="40"  y="70"  width="700" height="112" rx="14"/>
    <rect x="40"  y="200" width="700" height="112" rx="14"/>
    <rect x="40"  y="330" width="700" height="112" rx="14"/>
    <rect x="40"  y="460" width="700" height="112" rx="14"/>
    <rect x="40"  y="590" width="700" height="112" rx="14"/>
    <rect x="40"  y="720" width="700" height="112" rx="14"/>
    <rect x="40"  y="850" width="700" height="84"  rx="14"/>
  </g>

  <text x="390" y="122" text-anchor="middle"><tspan x="390" dy="12">MIT-BIH Arrhythmia DB</tspan><tspan x="390" dy="36">(48 recordings, 360 Hz)</tspan></text>
  <text x="390" y="252" text-anchor="middle"><tspan x="390" dy="12">R-peak 1-s windows, classes N/A/V</tspan><tspan x="390" dy="36">per-window normalization to [-1, 1]</tspan></text>
  <text x="390" y="382" text-anchor="middle"><tspan x="390" dy="12">Patient-level split</tspan><tspan x="390" dy="36">train / validation / test (record-aware)</tspan></text>
  <text x="390" y="512" text-anchor="middle"><tspan x="390" dy="12">Architectures: CNN . LSTM . GRU . TCN</tspan><tspan x="390" dy="36">+ Conv1D autoencoder denoiser</tspan></text>
  <text x="390" y="642" text-anchor="middle"><tspan x="390" dy="12">Quantization: FP32 to int8 TFLite</tspan><tspan x="390" dy="36">CNN/TCN full-int8; LSTM/GRU float32</tspan></text>
  <text x="390" y="772" text-anchor="middle"><tspan x="390" dy="12">Experiments: grouped CV . noise 0-40 dB</tspan><tspan x="390" dy="36">SVDB external . temperature calibration</tspan></text>
  <text x="390" y="890" text-anchor="middle"><tspan x="390" dy="6">On-device: ESP32-S3 int8 inference,</tspan><tspan x="390" dy="34">memory footprint and latency</tspan></text>

  <line x1="390" y1="184" x2="390" y2="196" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
  <line x1="390" y1="314" x2="390" y2="326" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
  <line x1="390" y1="444" x2="390" y2="456" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
  <line x1="390" y1="574" x2="390" y2="586" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
  <line x1="390" y1="704" x2="390" y2="716" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
  <line x1="390" y1="834" x2="390" y2="846" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrM)"/>
</svg>
