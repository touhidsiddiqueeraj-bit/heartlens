<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="Times, serif" font-size="30">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <text x="390" y="42" text-anchor="middle" font-size="34" fill="#111">ESP32-S3 inference pipeline</text>

  <g stroke="#2c3e50" stroke-width="2.5" fill="#eef3f8">
    <rect x="40"  y="90"  width="200" height="130" rx="14"/>
    <rect x="290" y="90"  width="200" height="130" rx="14"/>
    <rect x="540" y="90"  width="200" height="130" rx="14"/>
    <rect x="40"  y="320" width="200" height="130" rx="14"/>
    <rect x="290" y="320" width="200" height="130" rx="14"/>
    <rect x="540" y="320" width="200" height="130" rx="14"/>
  </g>

  <!-- row 1 labels -->
  <text x="140" y="150" text-anchor="middle"><tspan x="140" dy="14">ADC</tspan><tspan x="140" dy="36">360 Hz</tspan></text>
  <text x="390" y="150" text-anchor="middle"><tspan x="390" dy="14">Quality</tspan><tspan x="390" dy="36">gate</tspan></text>
  <text x="640" y="150" text-anchor="middle"><tspan x="640" dy="14">Denoiser</tspan><tspan x="640" dy="36">int8</tspan></text>
  <!-- row 2 labels -->
  <text x="140" y="380" text-anchor="middle"><tspan x="140" dy="14">Sliding CNN</tspan><tspan x="140" dy="36">classifier int8</tspan></text>
  <text x="390" y="380" text-anchor="middle"><tspan x="390" dy="14">Weighted</tspan><tspan x="390" dy="36">vote</tspan></text>
  <text x="640" y="380" text-anchor="middle"><tspan x="640" dy="14">Class +</tspan><tspan x="640" dy="36">confidence</tspan></text>

  <!-- row 1 arrows -->
  <line x1="242" y1="155" x2="286" y2="155" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="492" y1="155" x2="536" y2="155" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <!-- row 2 arrows -->
  <line x1="242" y1="385" x2="286" y2="385" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="492" y1="385" x2="536" y2="385" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
  <!-- snake: denoiser (row1 right) down then left to row2 classifier -->
  <path d="M 640 222 L 640 272 L 140 272 L 140 316" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr)"/>
</svg>
