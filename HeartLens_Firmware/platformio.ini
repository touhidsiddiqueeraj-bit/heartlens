; HeartLens AI — PlatformIO build (headless alternative to Arduino IDE)
; Targets: ESP32-WROOM-32 (esp32dev) and ESP32-S3 N16R8 (esp32-s3-devkitc-1)
;
; Build:        pio run -e esp32-s3-devkitc-1
; Upload+watch: pio run -t upload -e esp32-s3-devkitc-1 && pio device monitor -e esp32-s3-devkitc-1
;
; Models: the TFLite Micro source lives in lib/tensorflow_lite (populated
; by ./setup_tflite_micro.sh — same source both for Arduino IDE and PIO).

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
lib_extra_dirs = lib
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINOSTL_M_H
    -DCONFIG_NN_OPTIMIZED
    -DCONFIG_IDF_TARGET_ESP32S3
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/models
    -I${PROJECT_DIR}/lib/esp_nn/include
    -I${PROJECT_DIR}/lib/esp_nn/src/common
    -I${PROJECT_DIR}/src/esp_nn_impl
    -I${PROJECT_DIR}/lib/tensorflow_lite/third_party/flatbuffers/include
    -I${PROJECT_DIR}/lib/tensorflow_lite/third_party/gemmlowp
    -I${PROJECT_DIR}/lib/tensorflow_lite/third_party/kissfft
    -I${PROJECT_DIR}/lib/tensorflow_lite/third_party/ruy

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
build_flags =
    ${env.build_flags}
